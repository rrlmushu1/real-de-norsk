name: Sync corporate site assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-corporate-site.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current published corporate assets
        shell: bash
        run: |
          set -euo pipefail
          for file in site.js style.css config.js admin.mjs cms-auth.mjs cms-client.mjs portal-ui.mjs portal.mjs requests.mjs; do
            curl --fail --location --retry 3 --silent --show-error "https://real-de-norsk.pages.dev/$file" -o "$file"
            test -s "$file"
          done
          cat > index.html <<'HTML'
          <!doctype html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#08090c"/><meta name="description" content="Real de Norsk — Soluciones Logísticas Aplicadas"/><title>Real de Norsk | Soluciones Logísticas Aplicadas</title><link rel="stylesheet" href="./style.css"/></head><body><div id="root"></div><script src="/config.js"></script><script type="module" src="./site.js"></script></body></html>
          HTML
      - name: Commit complete site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site.js style.css config.js admin.mjs cms-auth.mjs cms-client.mjs portal-ui.mjs portal.mjs requests.mjs
          git diff --cached --quiet || (git commit -m 'Sync complete Real de Norsk corporate site' && git push)
