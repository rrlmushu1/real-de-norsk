<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Real de Norsk | Cotizador</title><style>body{font:16px system-ui;background:#101b28;color:white;max-width:740px;margin:auto;padding:20px}section{background:#1d3042;padding:18px;border-radius:12px;margin:16px 0}label{display:block;margin-top:12px}input,button{width:100%;box-sizing:border-box;padding:12px;font:inherit;border-radius:8px}button{background:#e1c384;font-weight:bold;margin-top:16px}pre{white-space:pre-wrap;font:inherit;line-height:1.6}small{color:#ccc}</style><h1>Real de Norsk Autotransporte</h1><p>Cotizador de fletes · MXN</p><section><h2>Ruta</h2><label>Ubicación del camión</label><input id="truck" placeholder="Querétaro"><label>Origen de carga</label><input id="origin" placeholder="San Luis Potosí"><label>Destino</label><input id="dest" placeholder="Ciénega de Flores"><label>Kilómetros de posicionamiento</label><input id="pos" type="number" value="0"><label>Kilómetros origen a destino</label><input id="load" type="number"><label>Casetas MXN</label><input id="tolls" type="number" value="0"><label>Peso toneladas</label><input id="tons" type="number" value="25"><small>Distancias y casetas manuales mientras se valida la conexión SAKBÉ. Posicionamiento cobrado como cargado.</small></section><section><h2>Costos</h2><label>Diésel MXN/litro</label><input id="diesel" type="number" value="26"><label>Rendimiento km/litro</label><input id="eff" type="number" value="2.5"><label>Otros gastos MXN</label><input id="other" type="number" value="0"><label>Margen bruto %</label><input id="margin" type="number" value="30"><label>Reserva fiscal estimada % sobre utilidad</label><input id="tax" type="number" value="30"><button id="calc">Calcular</button></section><section id="results" hidden><h2>Cliente</h2><pre id="client"></pre><button onclick="window.print()">Imprimir / guardar PDF</button><h2>Interno</h2><pre id="internal"></pre></section><script>const e=x=>document.getElementById(x),n=x=>Number(e(x).value),f=x=>x.toLocaleString('es-MX',{style:'currency',currency:'MXN'});e('calc').onclick=()=>{let p=n('pos'),l=n('load'),km=p+l,t=n('tolls'),w=n('tons'),d=n('diesel'),r=n('eff'),o=n('other'),m=n('margin')/100,tax=n('tax')/100;if(![p,l,t,w,d,r,o,m,tax].every(Number.isFinite)||p<0||l<=0||t<0||w<=0||d<0||r<=0||o<0||m<0||m>=1||tax<0||tax>1){alert('Revisa los valores');return}let fuel=km/r*d,maint=km*2.15,driver=km*1.5,base=fuel+maint+driver+o,ex=Math.max(0,w-25),exFuel=fuel*.022*ex/.925,exWear=km*.15*ex/.925,freight=base/(1-m),cas=t*1.1,sub=freight+cas+exFuel+exWear,iva=sub*.16,profit=freight-base;e('client').textContent='Ruta: '+e('origin').value+' → '+e('dest').value+'\nKilómetros facturables: '+km.toFixed(1)+'\nFlete: '+f(sub)+'\nIVA 16%: '+f(iva)+'\nTOTAL: '+f(sub+iva);e('internal').textContent='Posicionamiento: '+p+' km (cobrados como cargados)\nViaje con carga: '+l+' km\nDiésel: '+f(fuel)+'\nMantenimiento: '+f(maint)+'\nOperador variable: '+f(driver)+'\nOtros: '+f(o)+'\nCasetas costo: '+f(t)+'\nCasetas facturadas: '+f(cas)+'\nRecargo combustible sobrepeso: '+f(exFuel)+'\nRecargo gastos operativos sobrepeso: '+f(exWear)+'\nUtilidad bruta base: '+f(profit)+'\nReserva fiscal estimada: '+f(profit*tax)+'\nIVA cobrado: '+f(iva)+'\nNota: reserva fiscal preliminar, no impuesto definitivo.';e('results').hidden=false;e('results').scrollIntoView()};</script>
